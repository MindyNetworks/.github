# Piso de seguridad de todas las organizaciones de Mindy.
#
# Este es un workflow REUSABLE: no corre solo, lo invocan los repos. Vive en un
# repositorio publico, y por eso lo pueden invocar los repos privados de
# MindyNetworks, Mindy-Haxor-Team y MindyFyH por igual — los workflows de un
# repositorio publico son invocables desde cualquier organizacion.
#
# Arreglar un pin o una regla aca llega a todos los repos. Eso es el punto: la
# version anterior de este archivo se habia copiado a mano y quedo congelada en
# 3 de 45 repositorios.
#
# Como se invoca, desde .github/workflows/security.yml del repo:
#
#   name: Seguridad
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: '17 6 * * 1'
#     workflow_dispatch:
#   concurrency:
#     group: seguridad-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     piso:
#       uses: MindyNetworks/.github/.github/workflows/security.yml@main
#
# Las dos herramientas se usan por imagen oficial, no por la Action
# empaquetada: la Action de gitleaks exige licencia paga en repositorios
# privados, mientras el binario y la imagen son open source y gratis sin
# importar la visibilidad del repositorio.
#
# Falso positivo:
#   - gitleaks: agregar una regla de allowlist en .gitleaks.toml
#   - semgrep:  comentario `// nosemgrep` en la linea, o .semgrepignore

name: Seguridad (reusable)

on:
  workflow_call:
    inputs:
      semgrep_config:
        description: Reglas de semgrep. Varios packs separados por espacio.
        type: string
        required: false
        default: "p/security-audit p/secrets"
      gitleaks_full_history:
        description: >
          Escanear todo el historial en push, cron y dispatch. Falso escanea solo
          el estado actual. En un pull request no aplica: se escanean siempre
          los commits del PR.
        type: boolean
        required: false
        default: true
      block_data_files:
        description: >
          Forzar el rechazo de planillas y CSV fuera del directorio de fixtures.
          Normalmente NO hace falta pasarlo: se activa solo cuando .mindy.yml
          declara `data: financial` o `data: health`. Esto existe para poder
          activarlo en un repositorio que todavia no tiene .mindy.yml.
        type: boolean
        required: false
        default: false
      fixtures_dir:
        description: Unico directorio donde se permiten esos archivos.
        type: string
        required: false
        default: "tests/fixtures"
      single_job:
        description: >
          Correr todas las verificaciones en UN job, `Piso de seguridad`, en vez
          de tres. GitHub factura cada job redondeado al minuto: tres jobs de
          ~1,5 min cuestan 5 minutos por corrida, uno de ~3 min cuesta 3. Se
          pierde el paralelo. Cambia el nombre del check: activarlo solo junto
          con los checks requeridos del repositorio.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # Lee el perfil del repositorio que invoca. Existe para que el control de
  # archivos de datos se active solo donde corresponde, sin depender de que
  # alguien recuerde descomentar un input en el invocador: la fuente de verdad
  # es .mindy.yml, el mismo archivo que lee AGENTS.md.
  # Tres verificaciones baratas en UN job, a proposito.
  #
  # GitHub factura un minimo de un minuto por job, aunque el job termine en
  # tres segundos. Estas tres tardan entre 5 y 17 segundos cada una y antes
  # vivian en jobs separados: tres minutos facturados por corrida, en cada
  # push y cada pull request de cada repositorio. Medido en Mindy-Haxor-Team en
  # septiembre de 2026: 181 corridas de este workflow, 905 minutos facturados
  # de los 2.000 del plan, casi todos aire.
  #
  # Fusionadas cuestan un minuto. La visibilidad se conserva: cada verificacion
  # sigue siendo un paso propio y el que no aplica aparece como omitido.
  perfil:
    name: Perfil, plantilla y planillas
    if: ${{ !inputs.single_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Leer .mindy.yml
        id: leer
        run: |
          D=$(grep -E '^data:' .mindy.yml 2>/dev/null | head -1 \
              | sed 's/^data:[[:space:]]*//; s/[[:space:]]*#.*//; s/[[:space:]]*$//')
          echo "datos=${D:-none}" >> "$GITHUB_OUTPUT"
          echo "Perfil de datos: ${D:-none}"

      # Un AGENTS.md con los placeholders de la plantilla es peor que no
      # tenerlo: en los repositorios sin CLAUDE.md es la unica instruccion que
      # lee un agente, y sin llenar le diria que el proyecto se llama
      # "[Nombre del proyecto]" y que valide con Zod en un repositorio que no
      # usa Zod. Avisa, no bloquea.
      - name: Verificar AGENTS.md
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "Sin AGENTS.md en este repositorio. Nada que verificar."
            exit 0
          fi
          PENDIENTE=0
          avisar() { echo "::warning file=AGENTS.md::$1"; PENDIENTE=1; }
          if grep -q '\[Nombre del proyecto\]' AGENTS.md; then
            avisar "El titulo sigue siendo [Nombre del proyecto]."
          fi
          if grep -q 'Instrucciones para completar este archivo' AGENTS.md; then
            avisar "Queda la seccion de instrucciones de la plantilla: borrarla al terminar."
          fi
          if grep -q 'Que hace, para quien, y que NO hace\|Qué hace, para quién, y qué NO hace' AGENTS.md; then
            avisar "La seccion 'El proyecto' esta sin llenar."
          fi
          if grep -q 'Flujo de ramas de este repo:\*\* \[' AGENTS.md; then
            avisar "Falta declarar el flujo de ramas real (main / develop -> staging -> main)."
          fi
          if grep -q 'Ejemplo de como se ve una regla\|Ejemplo de cómo se ve una regla' AGENTS.md; then
            avisar "Queda el bloque de ejemplo con Zod: borrarlo y poner las reglas reales."
          fi
          if [ "$PENDIENTE" = "1" ]; then
            {
              echo "### AGENTS.md sin completar"
              echo ""
              echo "Quedan placeholders de la plantilla. Ver los avisos de este job."
              echo "No se bloquea el merge, pero un agente que lea este archivo va a"
              echo "afirmar cosas del proyecto que no son ciertas."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AGENTS.md sin placeholders de la plantilla."
          fi

      # gitleaks busca patrones de credenciales. Un export de contabilidad real
      # no matchea ninguno: es una planilla con nombres, RUTs y montos, y pasa
      # el escaneo sin una sola alerta. Este paso cubre ese hueco.
      - name: Planillas fuera de fixtures
        if: inputs.block_data_files || steps.leer.outputs.datos == 'financial' || steps.leer.outputs.datos == 'health'
        env:
          FIXTURES: ${{ inputs.fixtures_dir }}
        run: |
          MALOS=$(git ls-files '*.csv' '*.xlsx' '*.xls' '*.ods' '*.sql.gz' '*.dump' \
                  | grep -v "^${FIXTURES}/" || true)
          if [ -n "$MALOS" ]; then
            echo "::error::Hay archivos de datos fuera de ${FIXTURES}/:"
            echo "$MALOS" | sed 's/^/  /'
            echo ""
            echo "Estos archivos suelen ser exports reales. Si son datos de prueba,"
            echo "moverlos a ${FIXTURES}/. Si son reales, no van en el repositorio."
            exit 1
          fi
          echo "Sin archivos de datos fuera de ${FIXTURES}/."

  gitleaks:
    name: Secretos
    if: ${{ !inputs.single_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La condicion va invertida a proposito. En las expresiones de
          # GitHub `0` es falsy, asi que el patron habitual
          # `cond && 0 || 1` devuelve SIEMPRE 1: con la condicion en true da
          # `0`, y `0 || 1` vuelve a caer en el 1. Invertida, el brazo
          # verdadero vale 1 —truthy— y el 0 queda solo como fallback.
          #
          # El bug tenia consecuencias: el input decia escanear todo el
          # historial y por defecto viene en true, pero el checkout era
          # siempre de profundidad 1. Ningun repositorio escaneo su historial
          # desde que existe este workflow, y como el unico commit presente en
          # un evento pull_request es el merge efimero que fabrica
          # actions/checkout, los allowlist por commit de .gitleaks.toml no
          # podian matchear nunca.
          #
          # En un pull request el checkout es siempre de profundidad 1: el
          # paso de gitleaks trae despues solo los commits del PR. Clonar el
          # historial completo para escanear un rango de pocos commits era la
          # mayor parte del tiempo del job.
          fetch-depth: ${{ (github.event_name == 'pull_request' || !inputs.gitleaks_full_history) && 1 || 0 }}

      # Imagen pineada por digest, no por tag. Un tag es movil: `latest` o
      # incluso `v8.30.1` pueden reapuntar a otra imagen, y ahi la cadena de
      # suministro queda abierta. El digest no se puede reapuntar.
      - name: Escanear con gitleaks
        env:
          EVENTO: ${{ github.event_name }}
          # Vacios fuera de un pull_request.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          FULL_HISTORY: ${{ inputs.gitleaks_full_history }}
        run: |
          # En un pull request se escanean SOLO los commits del PR, sin
          # importar gitleaks_full_history. En push, cron y dispatch manda el
          # input: historial completo o arbol actual.
          #
          # El historial no cambia entre un PR y el siguiente, asi que
          # re-escanearlo en cada corrida no encuentra nada nuevo y cuesta
          # carisimo: en mindyv2 son 1h43m sobre 878 MB, por pull request. La
          # barrida historica es trabajo del cron semanal; el PR solo tiene que
          # atrapar lo que ese PR introduce. Escanear los commits, y no el diff
          # final, atrapa tambien un secreto agregado en un commit y borrado en
          # el siguiente: sigue en el historial aunque el diff no lo muestre.
          RANGO=()
          if [ "$EVENTO" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            # HEAD es el merge commit que arma GitHub. El commit mas viejo del
            # PR esta a lo sumo a COMMITS saltos de el y sus padres a COMMITS+1:
            # con profundidad COMMITS+2 todo commit del PR tiene a sus padres
            # en el clon. Uno sin padres seria un borde del clon superficial:
            # git lo muestra como si agregara su arbol completo, y gitleaks
            # volveria a escanear el repositorio entero.
            if [[ "${COMMITS:-}" =~ ^[0-9]+$ ]] \
              && git fetch --no-tags --quiet --depth="$((COMMITS + 2))" origin "$(git rev-parse HEAD)" \
              && { git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
                   || git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA"; }; then
              # Los bordes que caen dentro de BASE..HEAD son commits de la
              # rama base que no alcanzan a unirse con BASE_SHA en el clon.
              # Ninguno es del PR, porque los del PR tienen a sus padres: se
              # excluyen para no escanear su arbol completo.
              BORDES=""
              SHALLOW=$(git rev-parse --git-path shallow)
              if [ -f "$SHALLOW" ]; then
                BORDES=$(git rev-list "$BASE_SHA..HEAD" | grep -Fx -f "$SHALLOW" | sed 's/^/^/' | paste -sd ' ' - || true)
              fi
              RANGO=("--log-opts=$BASE_SHA..HEAD${BORDES:+ $BORDES}")
              echo "Modo pull request: se escanean los commits de $BASE_SHA..HEAD"
            else
              echo "::warning::No se pudo traer el historial del PR: se escanea lo que hay en el clon (arbol actual)."
            fi
          elif [ "$FULL_HISTORY" = "true" ]; then
            echo "Modo completo: todo el historial"
          else
            echo "Modo arbol: checkout de profundidad 1, se escanea el estado actual"
          fi
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --verbose --redact --exit-code=1 "${RANGO[@]}"

  semgrep:
    name: Analisis estatico
    if: ${{ !inputs.single_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --metrics off es deliberado: por defecto semgrep manda metadata del
      # repositorio a semgrep.dev en cada corrida, y estos son repositorios
      # privados con datos de salud y financieros.
      #
      # Los packs `p/...` igual se descargan del registry de semgrep.dev. Para
      # quedar 100% offline habria que versionar las reglas dentro de este
      # repositorio y apuntar --config a un path local; queda como paso
      # siguiente si se decide cortar toda salida a internet.
      - name: Escanear con semgrep
        env:
          EVENTO: ${{ github.event_name }}
          # Vacio fuera de un pull_request.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CONFIGS=""
          for C in ${{ inputs.semgrep_config }}; do CONFIGS="$CONFIGS --config $C"; done
          # En un pull request semgrep analiza solo los archivos que cambiaron
          # respecto de la rama base y reporta solo los hallazgos nuevos
          # (--baseline-commit). En push, cron y dispatch analiza el
          # repositorio entero, como siempre.
          #
          # semgrep calcula `git merge-base BASE_SHA HEAD`. HEAD es el merge
          # commit del PR y en un checkout de profundidad 1 no tiene padres en
          # el clon, asi que traer solo BASE_SHA no alcanza: se trae HEAD con
          # profundidad 2, que une a HEAD con su padre de la rama base. Si aun
          # asi no hay merge base, se analiza el repositorio entero.
          #
          # Con linea base el montaje es de escritura: semgrep hace
          # `git reset --hard` a la base (o un `git worktree`) para analizarla
          # y vuelve a HEAD al terminar. Con el montaje de solo lectura falla.
          BASELINE=()
          MONTAJE=ro
          if [ "$EVENTO" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if ! git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --quiet --depth=2 origin "$(git rev-parse HEAD)" || true
              git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
                || git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA" || true
            fi
            if git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
              BASELINE=(--baseline-commit "$BASE_SHA")
              MONTAJE=rw
              echo "Modo pull request: hallazgos nuevos respecto de $BASE_SHA"
            else
              echo "::warning::Sin merge base con $BASE_SHA: se analiza el repositorio entero."
            fi
          fi
          docker run --rm -v "$PWD:/src:$MONTAJE" -w /src \
            semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
            semgrep scan $CONFIGS --metrics off --error "${BASELINE[@]}"

  # Las mismas verificaciones que `perfil`, `gitleaks` y `semgrep`, en UN job,
  # solo con `single_job: true`. Los pasos de los tres jobs se copian tal cual:
  # un cambio en uno de ellos va tambien aca.
  #
  # Cada verificacion que puede fallar sigue de largo (`continue-on-error`) y
  # `Resultado` falla al final nombrando cuales fallaron, asi que un error de
  # secretos no esconde uno de semgrep. Es lo que se perdia al fusionar.
  piso:
    name: Piso de seguridad
    if: ${{ inputs.single_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Misma expresion invertida que el job `Secretos`, con profundidad 1
          # en un pull request.
          fetch-depth: ${{ (github.event_name == 'pull_request' || !inputs.gitleaks_full_history) && 1 || 0 }}

      - name: Leer .mindy.yml
        id: leer
        run: |
          D=$(grep -E '^data:' .mindy.yml 2>/dev/null | head -1 \
              | sed 's/^data:[[:space:]]*//; s/[[:space:]]*#.*//; s/[[:space:]]*$//')
          echo "datos=${D:-none}" >> "$GITHUB_OUTPUT"
          echo "Perfil de datos: ${D:-none}"

      - name: Verificar AGENTS.md
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "Sin AGENTS.md en este repositorio. Nada que verificar."
            exit 0
          fi
          PENDIENTE=0
          avisar() { echo "::warning file=AGENTS.md::$1"; PENDIENTE=1; }
          if grep -q '\[Nombre del proyecto\]' AGENTS.md; then
            avisar "El titulo sigue siendo [Nombre del proyecto]."
          fi
          if grep -q 'Instrucciones para completar este archivo' AGENTS.md; then
            avisar "Queda la seccion de instrucciones de la plantilla: borrarla al terminar."
          fi
          if grep -q 'Que hace, para quien, y que NO hace\|Qué hace, para quién, y qué NO hace' AGENTS.md; then
            avisar "La seccion 'El proyecto' esta sin llenar."
          fi
          if grep -q 'Flujo de ramas de este repo:\*\* \[' AGENTS.md; then
            avisar "Falta declarar el flujo de ramas real (main / develop -> staging -> main)."
          fi
          if grep -q 'Ejemplo de como se ve una regla\|Ejemplo de cómo se ve una regla' AGENTS.md; then
            avisar "Queda el bloque de ejemplo con Zod: borrarlo y poner las reglas reales."
          fi
          if [ "$PENDIENTE" = "1" ]; then
            {
              echo "### AGENTS.md sin completar"
              echo ""
              echo "Quedan placeholders de la plantilla. Ver los avisos de este job."
              echo "No se bloquea el merge, pero un agente que lea este archivo va a"
              echo "afirmar cosas del proyecto que no son ciertas."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AGENTS.md sin placeholders de la plantilla."
          fi

      - name: Planillas fuera de fixtures
        id: planillas
        if: inputs.block_data_files || steps.leer.outputs.datos == 'financial' || steps.leer.outputs.datos == 'health'
        continue-on-error: true
        env:
          FIXTURES: ${{ inputs.fixtures_dir }}
        run: |
          MALOS=$(git ls-files '*.csv' '*.xlsx' '*.xls' '*.ods' '*.sql.gz' '*.dump' \
                  | grep -v "^${FIXTURES}/" || true)
          if [ -n "$MALOS" ]; then
            echo "::error::Hay archivos de datos fuera de ${FIXTURES}/:"
            echo "$MALOS" | sed 's/^/  /'
            echo ""
            echo "Estos archivos suelen ser exports reales. Si son datos de prueba,"
            echo "moverlos a ${FIXTURES}/. Si son reales, no van en el repositorio."
            exit 1
          fi
          echo "Sin archivos de datos fuera de ${FIXTURES}/."

      - name: Escanear con gitleaks
        id: secretos
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          FULL_HISTORY: ${{ inputs.gitleaks_full_history }}
        run: |
          # Misma logica que el job `Secretos`: en un pull request, solo los
          # commits del PR, con la profundidad justa para que cada uno tenga a
          # sus padres en el clon y sin los bordes de la rama base.
          RANGO=()
          if [ "$EVENTO" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if [[ "${COMMITS:-}" =~ ^[0-9]+$ ]] \
              && git fetch --no-tags --quiet --depth="$((COMMITS + 2))" origin "$(git rev-parse HEAD)" \
              && { git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
                   || git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA"; }; then
              BORDES=""
              SHALLOW=$(git rev-parse --git-path shallow)
              if [ -f "$SHALLOW" ]; then
                BORDES=$(git rev-list "$BASE_SHA..HEAD" | grep -Fx -f "$SHALLOW" | sed 's/^/^/' | paste -sd ' ' - || true)
              fi
              RANGO=("--log-opts=$BASE_SHA..HEAD${BORDES:+ $BORDES}")
              echo "Modo pull request: se escanean los commits de $BASE_SHA..HEAD"
            else
              echo "::warning::No se pudo traer el historial del PR: se escanea lo que hay en el clon (arbol actual)."
            fi
          elif [ "$FULL_HISTORY" = "true" ]; then
            echo "Modo completo: todo el historial"
          else
            echo "Modo arbol: checkout de profundidad 1, se escanea el estado actual"
          fi
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --verbose --redact --exit-code=1 "${RANGO[@]}"

      - name: Escanear con semgrep
        id: estatico
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CONFIGS=""
          for C in ${{ inputs.semgrep_config }}; do CONFIGS="$CONFIGS --config $C"; done
          # Misma logica que el job `Analisis estatico`: en un pull request,
          # solo hallazgos nuevos respecto de la base, con montaje de escritura.
          # Despues del paso de gitleaks la merge base suele estar en el clon y
          # no hace falta traer nada.
          BASELINE=()
          MONTAJE=ro
          if [ "$EVENTO" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            if ! git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
              git fetch --no-tags --quiet --depth=2 origin "$(git rev-parse HEAD)" || true
              git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
                || git fetch --no-tags --quiet --depth=1 origin "$BASE_SHA" || true
            fi
            if git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
              BASELINE=(--baseline-commit "$BASE_SHA")
              MONTAJE=rw
              echo "Modo pull request: hallazgos nuevos respecto de $BASE_SHA"
            else
              echo "::warning::Sin merge base con $BASE_SHA: se analiza el repositorio entero."
            fi
          fi
          docker run --rm -v "$PWD:/src:$MONTAJE" -w /src \
            semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
            semgrep scan $CONFIGS --metrics off --error "${BASELINE[@]}"

      - name: Resultado
        if: always()
        env:
          PLANILLAS: ${{ steps.planillas.outcome }}
          SECRETOS: ${{ steps.secretos.outcome }}
          ESTATICO: ${{ steps.estatico.outcome }}
        run: |
          FALLO=0
          fallo() { echo "::error::$1"; FALLO=1; }
          [ "$PLANILLAS" = "failure" ] && fallo "Planillas fuera de fixtures: hay archivos de datos fuera del directorio de fixtures."
          [ "$SECRETOS" = "failure" ] && fallo "Secretos: gitleaks encontro un posible secreto."
          [ "$ESTATICO" = "failure" ] && fallo "Analisis estatico: semgrep encontro hallazgos."
          if [ "$FALLO" = "0" ]; then
            echo "Planillas: $PLANILLAS · Secretos: $SECRETOS · Analisis estatico: $ESTATICO"
          fi
          exit "$FALLO"
