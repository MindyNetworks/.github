# Tests y cobertura sobre el diff, para todas las organizaciones de Mindy.
#
# Workflow REUSABLE, igual que security.yml. Lee la configuracion del propio
# repositorio desde .mindy.yml, para que el numero que exige el CI y el numero
# que el agente lee en AGENTS.md sean el mismo. Si divergen, el agente miente
# con confianza.
#
# .mindy.yml en la raiz del repositorio:
#
#   stack: nextjs-supabase   # informativo; la deteccion es automatica
#   tests: required          # required | suggested
#   coverage_diff: 85        # % minimo sobre lineas agregadas o modificadas
#   data: none               # none | financial | health
#
# Por que el umbral es sobre el DIFF y no sobre el proyecto: los repositorios
# arrancan sin tests. Un umbral global del 85% los deja rojos el primer dia, y
# la reaccion previsible es bajarlo a cero o escribir tests vacios que suben el
# numero sin verificar nada. Sobre el diff la regla es aplicable de inmediato
# —lo que escribas, cubrilo—, la deuda vieja no bloquea, y el promedio sube solo.
#
# `tests: suggested` corre todo igual pero nunca falla el job. Sirve para
# inventariar donde no hay tests sin bloquear a nadie.
#
# Como se invoca, desde .github/workflows/tests.yml del repo:
#
#   name: Tests
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   concurrency:
#     group: tests-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     tests:
#       uses: MindyNetworks/.github/.github/workflows/tests.yml@main

name: Tests (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: Subdirectorio del proyecto, si no esta en la raiz.
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  tests:
    name: Tests y cobertura del diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # diff-cover necesita la rama base

      # Parseo plano a proposito: son cuatro claves de un nivel y asi el
      # workflow no depende de que el runner traiga pyyaml.
      - name: Leer .mindy.yml
        id: cfg
        run: |
          leer() { grep -E "^$1:" .mindy.yml 2>/dev/null | head -1 | sed "s/^$1:[[:space:]]*//; s/[[:space:]]*#.*//; s/[[:space:]]*$//"; }
          MODO=$(leer tests);      MODO=${MODO:-suggested}
          UMBRAL=$(leer coverage_diff); UMBRAL=${UMBRAL:-0}
          echo "modo=$MODO"     >> "$GITHUB_OUTPUT"
          echo "umbral=$UMBRAL" >> "$GITHUB_OUTPUT"
          if [ ! -f .mindy.yml ]; then
            echo "::warning::Sin .mindy.yml. Se asume tests suggested y umbral 0."
          fi
          echo "Modo: $MODO — umbral sobre el diff: $UMBRAL%"

      - name: Detectar stack
        id: stack
        run: |
          # pubspec.yaml va primero: un repositorio Flutter puede tener ademas un
          # package.json de tooling (lint, husky) y no por eso corre tests de Node.
          if   [ -f pubspec.yaml ];                                    then S=flutter
          elif [ -f package.json ] && grep -q '"test"' package.json;   then S=node
          elif [ -f pyproject.toml ] || [ -f requirements.txt ];      then S=python
          elif [ -f go.mod ];                                          then S=go
          elif [ -f composer.json ];                                   then S=php
          elif ls *.tf >/dev/null 2>&1;                                then S=terraform
          else S=ninguno
          fi
          echo "stack=$S" >> "$GITHUB_OUTPUT"
          echo "Stack detectado: $S"

      # Un repositorio sin tests no falla, pero tampoco pasa en silencio: el
      # aviso es lo que produce el inventario de donde falta cubrir.
      - name: Sin stack de tests
        if: steps.stack.outputs.stack == 'ninguno'
        run: |
          echo "::warning::Sin stack de tests detectado. Nada que correr."
          echo "Si el proyecto vive en un subdirectorio, pasar working_directory al invocar."
          # Un check verde que no verifico nada es peor que un check ausente: da
          # por cumplido un `tests: required` que el CI no esta cumpliendo. No se
          # falla el job —eso dejaria rojos a todos los repositorios en adopcion—
          # pero queda escrito en el resumen del run, no solo en el log.
          if [ "${{ steps.cfg.outputs.modo }}" = "required" ]; then
            echo "::warning::.mindy.yml declara 'tests: required' y no se ejecuto ningun test."
            {
              echo "### Este check paso sin correr tests"
              echo ""
              echo ".mindy.yml declara \`tests: required\`, pero no se detecto stack de tests."
              echo "El check en verde NO significa que el codigo este verificado."
              echo ""
              echo "Stacks detectados hoy: Flutter (pubspec.yaml), Node (package.json con"
              echo "script test), Python, Go, PHP, Terraform. Si este repositorio usa otro,"
              echo "agregarlo en MindyNetworks/.github."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # El SDK se instala en un step propio porque `uses:` no respeta el
      # working-directory por defecto del job; el test si lo respeta.
      - name: Instalar Flutter
        if: steps.stack.outputs.stack == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter
        if: steps.stack.outputs.stack == 'flutter'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          flutter --version
          flutter pub get
          # --coverage emite coverage/lcov.info con rutas relativas a la raiz del
          # paquete, que es lo que diff-cover necesita para cruzarlo con el diff.
          flutter test --coverage

      - name: Node
        if: steps.stack.outputs.stack == 'node'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          # El gestor se detecta por lockfile, no se asume npm. Correr `npm
          # install` en un workspace de pnpm no es solo lento: ignora
          # pnpm-lock.yaml Y el bloque `pnpm.overrides` de package.json. Esos
          # overrides suelen ser pines de CVE (next, axios, undici, dompurify,
          # sharp, nanoid, js-yaml, brace-expansion en mindyv2), asi que el job
          # terminaba resolviendo un arbol distinto y sin parchar, y probando
          # ese. El piso de seguridad descartando los parches de seguridad.
          if [ -f pnpm-lock.yaml ]; then
            GESTOR=pnpm
            corepack enable
            # Respeta el campo packageManager del package.json si existe.
            corepack prepare --activate 2>/dev/null || true
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            # yarn no es un gestor soportado en Mindy y no se adopta: no hay un
            # solo yarn.lock en las tres organizaciones. Se falla con el comando
            # de migracion en vez de instalar igual, porque soportarlo en el CI
            # es permitirlo — y tres gestores son tres sintaxis distintas para
            # los pines de CVE, que es justo lo que este arreglo vino a evitar.
            echo "::error::yarn no es un gestor soportado. El estandar de Mindy es pnpm."
            echo "Migrar con: rm yarn.lock && pnpm import && pnpm install"
            exit 1
          elif [ -f package-lock.json ]; then
            GESTOR=npm
            npm ci
          else
            GESTOR=npm
            npm install
          fi
          echo "Gestor detectado: $GESTOR"

          # test:ci debe emitir cobertura en formato cobertura XML.
          # El template trae la config de vitest que lo hace.
          # El patron va anclado a los dos lados: sin el cierre, un repositorio
          # con test:ci-e2e y sin test:ci matchea igual y despues falla al correr
          # un script que no existe.
          if "$GESTOR" run 2>/dev/null | grep -qE '(^|[[:space:]])test:ci([[:space:]]|$)'; then
            "$GESTOR" run test:ci
          else
            "$GESTOR" test
          fi

      - name: Python
        if: steps.stack.outputs.stack == 'python'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          python -m pip install --quiet --upgrade pip
          [ -f requirements.txt ] && pip install --quiet -r requirements.txt || true
          pip install --quiet pytest pytest-cov
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Go
        if: steps.stack.outputs.stack == 'go'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: go test ./... -coverprofile=coverage.out

      - name: PHP
        if: steps.stack.outputs.stack == 'php'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          composer install --no-interaction --quiet
          if [ -f vendor/bin/phpunit ]; then vendor/bin/phpunit; else echo "::warning::Sin phpunit."; fi

      # Terraform no tiene cobertura: el equivalente es que la configuracion
      # sea valida y este formateada.
      - name: Terraform
        if: steps.stack.outputs.stack == 'terraform'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Cobertura sobre el diff
        if: steps.cfg.outputs.umbral != '0' && steps.stack.outputs.stack != 'ninguno' && steps.stack.outputs.stack != 'terraform'
        continue-on-error: ${{ steps.cfg.outputs.modo != 'required' }}
        run: |
          # diff-cover acepta cobertura XML y lcov: cualquier archivo que no
          # termine en .xml lo trata como lcov.info.
          REPORTE=""
          for F in coverage/cobertura-coverage.xml coverage.xml coverage/coverage.xml coverage/lcov.info lcov.info; do
            [ -f "$F" ] && REPORTE="$F" && break
          done
          if [ -z "$REPORTE" ]; then
            echo "::warning::No se encontro reporte de cobertura (cobertura XML ni lcov.info)."
            echo "Configurar el runner para emitirlo antes de exigir el umbral."
            exit 0
          fi
          python -m pip install --quiet 'diff-cover>=9,<10'
          BASE="origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}"
          git fetch --quiet origin "${BASE#origin/}" || true
          diff-cover "$REPORTE" --compare-branch="$BASE" \
            --fail-under=${{ steps.cfg.outputs.umbral }}
